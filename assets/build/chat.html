<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syna</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1114">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ambient.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/composer.css">
</head>
<body data-ambient="idle">

<div class="ambient" aria-hidden="true">
  <div class="field"></div>
  <div class="grain"></div>
</div>

<header>
  <span class="brand"><span class="brand-dot"></span>Syna</span>
  <button id="sound-btn" class="icon-btn" title="Toggle sound" aria-label="Toggle sound"></button>
</header>
<div id="banner">Cannot reach the Syna server. Retrying... (start it with "uv run syna-server" and open http://127.0.0.1:8000)</div>

<main id="chat"></main>

<footer>
  <div class="composer">
    <button id="attach-btn" class="icon-btn" title="Attach files" aria-label="Attach files"></button>
    <textarea id="input" rows="1" placeholder="Message Syna..." aria-label="Message"></textarea>
    <button id="send-btn" title="Send" aria-label="Send" disabled></button>
    <input id="file-input" type="file" multiple>
  </div>
</footer>

<script src="vendor/markdown-it.min.js"></script>
<script src="js/ambient.js"></script>
<script src="js/sfx.js"></script>
<script src="js/markdown.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
