.ambient {

  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: 0.9;
  background:

      color-mix(in srgb, var(--bgA) var(--tp), transparent),
      transparent 70%

      color-mix(in srgb, var(--bgB) var(--tp), transparent),
      transparent 70%

      color-mix(in srgb, var(--c3) calc(var(--tp) * 0.6), transparent),
      transparent 70%

    linear-gradient(
      160deg,
      color-mix(in srgb, var(--bgA) 6%, var(--bg)),
      var(--bg) 55%,

.inline-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--muted);
  padding: 5px 13px;
  align-self: center;
  border-radius: 999px;

    filter var(--dur-in) var(--ease),
    transform var(--dur-in) var(--ease);

  width: fit-content;

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  transition: background-color 0.4s ease;
  flex: none;
  position: relative;

.status-dot.working {
  background: var(--warn);
  animation: pulse 1.2s infinite;

.status-dot.ready {
  background: var(--ok);
}
.status-dot.error {
  background: var(--danger);
}

  width: 26px;
  height: 26px;
  padding: 0;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background-color: var(--surface-strong);
  border-color: var(--glass-line);
  color: var(--muted);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.25s var(--ease),
    color 0.2s ease,
    border-color 0.2s ease,
    transform 0.25s var(--ease);
}
.bubble.model:hover .copy-btn,
.bubble.model:focus-within .copy-btn,
.copy-btn:focus-visible,
.copy-btn.copied {
  opacity: 1;
  pointer-events: auto;
}
.copy-btn:hover {
  color: var(--text);
  border-color: var(--accent-line);
  transform: translateY(-1px);
}
.copy-btn:active {
  transform: scale(0.94);
}
.copy-btn .material-symbols-outlined {
  grid-area: 1 / 1;
  font-size: 14px;
  transition:
    opacity 0.2s ease,
    transform 0.3s var(--ease);
}
.copy-btn .i-check {
  opacity: 0;
  transform: scale(0.6) rotate(-12deg);
}
.copy-btn.copied {
  color: var(--ok);
}
.copy-btn.copied .i-check {
  opacity: 1;
  transform: none;
}
.copy-btn.copied .i-copy {
  opacity: 0;
  transform: scale(0.6) rotate(12deg);
}
@media (hover: none) {
  .bubble.model .copy-btn {
    opacity: 1;
    pointer-events: auto;
  }
}

/* ---------- tool calls ---------- */
.tool-row {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 9px; /* no row gap: the details panel owns its spacing via margin */
  font-size: 13px;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 14px;
  transition:
    background-color 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease,
    opacity var(--dur-in) var(--ease),
    filter var(--dur-in) var(--ease),
    transform var(--dur-in) var(--ease),
    display var(--dur-in) var(--ease) allow-discrete;
}
.tool-row.toggleable {
  cursor: pointer;
}
.tool-row.toggleable:hover {
  border-color: var(--accent-line);
}

/* running state = soft glow layers underneath + slow sheen, never a blink */
.tool-row.running {
  background-image: var(--frost);
  border-color: var(--border);
}
.tool-row.failed {
  border-color: var(--danger-line);
  color: var(--danger);
  background-color: color-mix(in srgb, var(--surface), var(--danger) 12%);
}
.tool-row::before,
.tool-row::after {
  content: "";
  position: absolute;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s ease;
}
.tool-row::before {
  inset: -1px;
  z-index: -1;
  border: 1px solid transparent;
  background: linear-gradient(135deg, var(--warn-tint), transparent 70%);
}
.tool-row::after {
  inset: 0;
  background: linear-gradient(
      100deg,
      transparent 30%,
      rgba(255, 255, 255, 0.3) 50%,
      transparent 70%
    )
    130% 0 / 220% 100% no-repeat;
  mix-blend-mode: soft-light;
}
.tool-row.running::before,
.tool-row.running::after {
  opacity: 1;
  transition-duration: 0.9s;
}
.tool-row.running::before,
.tool-row.settling::before {
  animation: ring-breathe 3s ease-in-out infinite;
}
.tool-row.running::after,
.tool-row.settling::after {
  animation: sheen 2.6s linear infinite;
}
@starting-style {
  .tool-row.running::before,
  .tool-row.running::after {
    opacity: 0;
  }
}
@keyframes ring-breathe {
  0%,
  100% {
    border-color: color-mix(in srgb, var(--warn) 14%, transparent);
    box-shadow:
      0 0 0 0 transparent,
      0 0 0 0 transparent;
  }
  50% {
    border-color: var(--warn);
    box-shadow:
      0 0 0 4px var(--warn-tint),
      0 0 22px 2px var(--warn-tint);
  }
}
@keyframes sheen {
  to {
    background-position: -30% 0;
  }
}

.tool-icon {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  transition:
    background-color 0.25s ease,
    border-color 0.25s ease;
}
.tool-icon .material-symbols-outlined {
  font-size: 13px;
  color: var(--muted);
  transition: color 0.4s ease;
}
.tool-row.failed .tool-icon {
  background: var(--danger-tint);
  border-color: var(--danger-line);
}
.tool-row.failed .tool-icon .material-symbols-outlined {
  color: var(--danger);
}

.tool-text {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--mono);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.tool-text::after {
  content: " ...";
  opacity: 0;
}
.tool-row.running .tool-text::after {
  animation: dots-pulse 1.8s ease-in-out infinite;
}
.tool-row.settling:not(.running) .tool-text::after {
  animation: dots-out 0.7s ease forwards;
}
@keyframes dots-pulse {
  0%,
  100% {
    opacity: 0.25;
  }
  50% {
    opacity: 1;
  }
}
@keyframes dots-out {
  from {
    opacity: 0.6;
  }
  to {
    opacity: 0;
  }
}

/* completion flash + icon pop */
.tool-row.just-done {
  animation: done-flash 1.3s var(--ease);
}
.tool-row.just-done .tool-icon {
  animation: icon-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes done-flash {
  0% {
    box-shadow:
      0 0 0 0 rgba(34, 197, 94, 0.45),
      var(--glass-shadow-soft);
  }
  100% {
    box-shadow:
      0 0 0 12px rgba(34, 197, 94, 0),
      var(--glass-shadow-soft);
  }
}

/* details panel: the row owns 0 row-gap, the panel owns 15px margin
   (9px flex gap + 6px old margin) so collapsing to 0 leaves no jump */
.tool-row pre {
  flex-basis: 100%;
  display: none;
  margin-top: 15px;
  padding: 8px 10px;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 240px;
  overflow-y: auto;
  opacity: 0;
  filter: blur(8px);
  transform: translateY(2px);
  cursor: auto;
  transition: none; /* open/close is animated from js/chat.js (height + margin + fade) */
}
.tool-row.open pre {
  display: block;
  opacity: 1;
  filter: blur(0);
  transform: none;
}

/* rows beyond MAX_VISIBLE_TOOL_CALLS live inside a wrapper; the pill expands
   and collapses THE WRAPPER (one height animation = one layout change), and
   rows inside only crossfade — opacity/blur never touch layout, so nothing
   janks or jumps while the run opens and closes. */
.tool-overflow {
  display: flex;
  flex-direction: column;
  gap: 10px; /* keep inner spacing identical to #chat */
}
/* '#chat > *' sets 'margin: 0 auto' with ID specificity, so this override
   must carry an ID too or the negative margin silently loses the cascade. */
#chat > .tool-overflow.collapsed {
  height: 0;
  margin-top: -10px; /* cancels the #chat gap on both sides while collapsed */
  overflow: hidden;
  visibility: hidden; /* out of the tab order once fully collapsed */
}

/* ---------- files ---------- */
.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px;
  border-radius: 12px;
  border-color: var(--glass-line);
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s var(--ease),
    box-shadow 0.2s ease;
}
.file-chip:hover {
  border-color: var(--accent-line);
  background: var(--surface-strong);
  transform: translateY(-1px);
}
.file-chip .material-symbols-outlined {
  flex: none;
  font-size: 17px;
  color: var(--accent);
}
.file-chip .file-meta {
  color: var(--muted);
  font-size: 12px;
}
.file-chip.outgoing {
  align-self: flex-end;
}
.files-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
  transition:
    opacity var(--dur-in) var(--ease),
    filter var(--dur-in) var(--ease),
    transform var(--dur-in) var(--ease);
}
.files-group.right {
  align-self: flex-end;
  align-items: flex-end;
}

/* ---------- events ---------- */
.event-row {
  font-size: 12.5px;
  color: var(--muted);
  padding: 6px 13px;
  border-radius: 999px;
  transition:
    opacity var(--dur-in) var(--ease),
    filter var(--dur-in) var(--ease),
    transform var(--dur-in) var(--ease);
}
.event-row.error {
  color: var(--danger);
  border-color: var(--danger-line);
  background-image:
    var(--frost), linear-gradient(135deg, var(--danger-tint), var(--surface));
}

/* ---------- see more / less: one stable pill, never changes size or position ---------- */
#chat > .see-more {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  padding: 0;
  gap: 0;
}
.see-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px 0 14px;
  font: 500 13px var(--mono);
  color: var(--text);
  cursor: pointer;
  border-radius: 999px;
  background-color: var(--surface-strong);
  border-color: var(--glass-line);
  transition:
    border-color 0.2s ease,
    transform 0.25s var(--ease),
    box-shadow 0.25s ease;
}
.see-btn:hover {
  border-color: var(--accent-line);
  transform: translateY(-1px);
}
.see-btn:active {
  transform: scale(0.96);
}
.see-label,
.see-slot {
  display: grid;
  align-items: center;
}
.see-label > span,
.see-slot > * {
  grid-area: 1 / 1;
  transition:
    opacity 0.3s ease,
    transform 0.4s var(--ease);
}
.see-label .l-less {
  opacity: 0;
  transform: translateY(6px);
}
.see-more.expanded .l-more {
  opacity: 0;
  transform: translateY(-6px);
}
.see-more.expanded .l-less {
  opacity: 1;
  transform: none;
}
.see-slot {
  width: 21px;
  justify-items: center;
}
.chev {
  font-size: 13px;
  color: var(--muted);
}
.see-more.expanded .chev {
  transform: rotate(180deg);
}
#chat .see-more .jump-dots {
  display: inline-flex;
  opacity: 0;
  margin: 0;
}
#chat .see-more.thinking .jump-dots {
  opacity: 1;
}
#chat .see-more.thinking .chev {
  opacity: 0;
}
.jump-dots {
  align-items: flex-end;
  gap: 3px;
  height: 7px;
  margin-left: 2px;
}
.jump-dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--muted);
  animation: jump 1.2s infinite ease-in-out;
}
.jump-dots i:nth-child(2) {
  animation-delay: 0.15s;
}
.jump-dots i:nth-child(3) {
  animation-delay: 0.3s;
}
@keyframes jump {
  0%,
  60%,
  100% {
    transform: translateY(0);
    opacity: 0.6;
  }
  30% {
    transform: translateY(-5px);
    opacity: 1;
  }
}

/* ---------- compaction ---------- */
.compaction-divider {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  opacity: 0.85;
  transition:
    opacity var(--dur-in) var(--ease),
    filter var(--dur-in) var(--ease),
    transform var(--dur-in) var(--ease);
}
.compaction-summary {
  padding: 8px 10px;
  border-radius: 10px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 240px;
  overflow-y: auto;
  transition:
    opacity var(--dur-in) var(--ease),
    filter var(--dur-in) var(--ease),
    transform var(--dur-in) var(--ease);
}

/* ---------- shared entrances & exits ---------- */
@starting-style {
  .bubble,
  .tool-row,
  .event-row,
  .queued-tag,
  .compaction-divider,
  .compaction-summary,
  .see-more,
  .files-group,
  .inline-status,
  #banner.visible {
    opacity: 0;
    filter: blur(12px);
    transform: translateY(10px) scale(0.985);
  }
  .bubble.user {
    transform: translate(18px, 14px) scale(0.9);
  }
  .bubble.model {
    transform: translate(-12px, 14px) scale(0.94);
  }
}
.leaving {
  opacity: 0 !important;
  filter: blur(12px) !important;
  transform: translateY(4px) scale(0.99) !important;
  pointer-events: none !important;
}

/* ---------- scrollbars ---------- */
#chat::-webkit-scrollbar,
.tool-row pre::-webkit-scrollbar,
.compaction-summary::-webkit-scrollbar,
.markdown pre::-webkit-scrollbar,
.markdown table::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
#chat::-webkit-scrollbar-thumb,
.tool-row pre::-webkit-scrollbar-thumb,
.compaction-summary::-webkit-scrollbar-thumb,
.markdown pre::-webkit-scrollbar-thumb,
.markdown table::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 999px;
  border: 3px solid transparent;
  background-clip: content-box;
}
#chat::-webkit-scrollbar-thumb:hover,
.tool-row pre::-webkit-scrollbar-thumb:hover,
.compaction-summary::-webkit-scrollbar-thumb:hover {
  background-color: var(--muted);
  background-clip: content-box;
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .status-dot.working,
  .status-dot.working::after,
  .jump-dots i,
  .tool-row.running,
  .tool-row::before,
  .tool-row::after,
  .tool-row.running .tool-text::after,
  .tool-text::after,
  .tool-row.just-done {
    animation: none !important;
  }
  .tool-row::before,
  .tool-row::after,
  .tool-text::after {
    transition: none !important;
  }
  .bubble,
  .tool-row,
  .event-row,
  .queued-tag,
  .compaction-divider,
  .compaction-summary,
  .see-more,
  .files-group,
  .inline-status,
  #banner {
    transition: none !important;
  }
}

/* ==== js/ambient.js ==== */
"use strict";

// Maps app activity onto the background light field:
//   idle     -> waiting for the user
//   thinking -> user sent a message, awaiting the model
//   tool     -> waiting for a tool call to complete
// Reads the global `busy` flag owned by js/chat.js.
let ambientState = "";
function updateAmbient() {
  const toolActive = document.querySelector(".tool-row.running") !== null;
  const next = !busy ? "idle" : toolActive ? "tool" : "thinking";
  if (next === ambientState) return;
  ambientState = next;
  document.body.setAttribute("data-ambient", next);
}

// Glow: a bright core with a corona. The corona is ~22 stacked translucent shapes whose
// outlines are r(theta) = R * (1 + spread * f^1.5 * (1 + amp * d(theta))), where d is a
// smoothed sum of random sine waves. Rendered small, upscaled and blurred = heavy diffusion.
(function () {
  const root = document.querySelector(".ambient");
  const field = root.querySelector(".field");
  const cv = document.createElement("canvas");
  cv.className = "glow";
  field.appendChild(cv);
  const c = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const TAU = Math.PI * 2,
    N = 180,
    L = 22;
  const PAL = {
    idle: [
      [167, 139, 250],
      [240, 160, 192],
      [124, 196, 255],
    ], // violet / rose / sky, merged
    thinking: [
      [255, 168, 96],
      [255, 207, 122],
      [255, 138, 122],
    ], // soft orange dominant
    tool: [
      [91, 155, 255],
      [127, 208, 255],
      [122, 124, 255],
    ], // mostly blue
  };
  const MODE = {
    idle: { gain: 1, speed: 1, amp: 0.4, spread: 1 },
    thinking: { gain: 2, speed: 2.4, amp: 0.8, spread: 1.15 },
    tool: { gain: 1.3, speed: 1.5, amp: 0.55, spread: 1.02 },
  };
  const col = PAL.idle.map((x) => x.slice());
  const W = { idle: 1, thinking: 0, tool: 0 };
  const cur = { gain: 1, speed: 1, amp: 0.4, spread: 1 };
  // random harmonics: integer k so the outline closes; low k dominate (smooth), each drifts at its own pace
  const SIN = [1, 2, 3, 5, 7, 10].map((k, i) => ({
    k,
    i,
    a: 1 / k ** 0.7,
    w: (0.12 + Math.random() * 0.3) * (Math.random() < 0.5 ? -1 : 1),
    p: Math.random() * TAU,
  }));
  const norm = SIN.reduce((n, x) => n + x.a, 0);
  const d = new Float32Array(N);
  const g = (x, w) => Math.exp(-((x / w) ** 2));
  let ks = 0,
    kv = 0,
    t = 0,
    last = performance.now(),
    pulse = 0;

  function resize() {
    cv.width = Math.max(200, Math.round(innerWidth * 0.26));
    cv.height = Math.max(200, Math.round(innerHeight * 0.26));
    if (reduce) draw(0.016);
  }
  addEventListener("resize", resize);

  function ring(s) {
    const r = document.createElement("div");
    r.className = "pulse-ring";
    root.appendChild(r);
    r.animate(
      [
        { transform: "scale(0.35)", opacity: 0.55 * s },
        { transform: "scale(1.9)", opacity: 0 },
      ],
      { duration: 1900, easing: "cubic-bezier(0.16, 1, 0.3, 1)" },
    ).onfinish = () => r.remove();
  }
  window.ambientKick = reduce
    ? () => {}
    : (k) => {
        kv += 4 * k;
        ring(k);
      };

  function draw(dt) {
    t += dt;
    const st = document.body.dataset.ambient || "idle";
    for (const k in W)
      W[k] += ((k === st ? 1 : 0) - W[k]) * Math.min(1, dt * 1.8);
    const m = MODE[st],
      ease = 1 - Math.exp(-dt * 1.2);
    for (const k in cur) cur[k] += (m[k] - cur[k]) * ease;
    PAL[st].forEach((tc, i) => {
      for (let j = 0; j < 3; j++) col[i][j] += (tc[j] - col[i][j]) * ease;
    });
    // breathing / state pulse
    const ph = (t % 1.15) / 1.15;
    const idle = 0.5 + 0.5 * Math.sin((t * TAU) / 8);
    const think =
      (0.5 + 0.5 * Math.sin((t * TAU) / 2.4)) *
      (0.75 + 0.25 * Math.sin((t * TAU) / 5.3));
    const beat = Math.min(
      1,
      g(Math.min(ph, 1 - ph), 0.08) + 0.65 * g(ph - 0.22, 0.07),
    );
    pulse = W.idle * idle + W.thinking * think + W.tool * beat;
    kv += (-90 * ks - 9 * kv) * dt;
    ks += kv * dt;
    // one corona per colour. Each is the same random-sine outline, but time-shifted (tau) and
    // radially scaled (scl) -> radial chromatic aberration; additive blend in dark mode
    for (const h of SIN) h.p += h.w * cur.speed * dt;
    const W_ = cv.width,
      H_ = cv.height,
      cx = W_ / 2,
      cy = H_ / 2;
    const R = Math.min(W_, H_) * 0.2;
    const sp = cur.spread * (1 + 0.13 * pulse + 0.2 * ks);
    const isDark = dark.matches;
    const alpha = (isDark ? 0.05 : 0.09) * (0.85 + 0.3 * pulse + 0.4 * ks);
    const rgb = (x) =>
      "rgb(" + (x[0] | 0) + "," + (x[1] | 0) + "," + (x[2] | 0) + ")";
    c.clearRect(0, 0, W_, H_);
    c.globalCompositeOperation = isDark ? "lighter" : "source-over";
    c.globalAlpha = alpha;
    for (let i = 0; i < 3; i++) {
      const tau = (i - 1) * 1.1,
        scl = 1 + (i - 1) * 0.12;
      d.fill(0);
      for (const h of SIN) {
        const amp =
          (h.a / norm) *
          (1 + (cur.gain - 1) * (h.i / 5)) *
          (1 + 0.4 * Math.sin(t * 0.2 + h.i * 1.7)) *
          1.6;
        const phs = h.p - h.w * cur.speed * tau;
        for (let n = 0; n < N; n++)
          d[n] += amp * Math.sin(h.k * (n / N) * TAU + phs);
      }
      c.fillStyle = rgb(col[i]);
      for (let j = 1; j <= L; j++) {
        const f = j / L,
          ff = f ** 1.5;
        c.beginPath();
        for (let n = 0; n <= N; n++) {
          const a = ((n % N) / N) * TAU,
            r = R * (1 + sp * scl * ff * (1 + cur.amp * d[n % N]));
          const x = cx + r * Math.cos(a),
            y = cy + r * Math.sin(a);
          n ? c.lineTo(x, y) : c.moveTo(x, y);
        }
        c.fill();
      }
    }
    c.globalCompositeOperation = "source-over";
    c.globalAlpha = 1;
    // hot rim hugging the core
    const hot = col[0].map((v) => v + (255 - v) * 0.6);
    const rim = c.createRadialGradient(cx, cy, R * 0.96, cx, cy, R * 1.3);
    rim.addColorStop(
      0,
      "rgba(" +
        hot.map((v) => v | 0).join(",") +
        "," +
        (0.5 + 0.2 * pulse) +
        ")",
    );
    rim.addColorStop(0.3, "rgba(" + hot.map((v) => v | 0).join(",") + ",0.16)");
    rim.addColorStop(1, "rgba(" + hot.map((v) => v | 0).join(",") + ",0)");
    c.fillStyle = rim;
    c.beginPath();
    c.arc(cx, cy, R * 1.3, 0, TAU);
    c.fill();
    // the bright core: a hot near-white heart tinted with the state hue, breathing with
    // the same pulse as the corona; creamy falloff melts it into the surrounding light
    const coreA = (isDark ? 0.95 : 0.85) * (0.86 + 0.14 * pulse);
    const coreHi = col[0].map((v) => v + (255 - v) * 0.85);
    const coreLo = col[0].map((v) => v + (255 - v) * 0.4);
    const coreG = c.createRadialGradient(cx, cy, 0, cx, cy, R);
    coreG.addColorStop(
      0,
      "rgba(" + coreHi.map((v) => v | 0).join(",") + "," + coreA + ")",
    );
    coreG.addColorStop(
      0.4,
      "rgba(" + coreHi.map((v) => v | 0).join(",") + "," + coreA * 0.62 + ")",
    );
    coreG.addColorStop(
      0.75,
      "rgba(" + coreLo.map((v) => v | 0).join(",") + "," + coreA * 0.22 + ")",
    );
    coreG.addColorStop(1, "rgba(" + col[0].map((v) => v | 0).join(",") + ",0)");
    c.fillStyle = coreG;
    c.beginPath();
    c.arc(cx, cy, R, 0, TAU);
    c.fill();
  }
  function frame(now) {
    const dt = Math.max(0.001, Math.min((now - last) / 1000, 0.05));
    last = now;
    draw(dt);
    requestAnimationFrame(frame);
  }
  resize();
  if (!reduce) requestAnimationFrame(frame);
})();

// Rendered by the vendored KaTeX after markdown. Two extra passes are needed
// because markdown-it would otherwise eat the backslashes ("\(" comes out of
// the parser as "("): math spans are lifted out before rendering, restored
// verbatim (HTML-escaped) after, and KaTeX auto-render then finds them in the
// DOM. Fenced and inline code are shielded first, so math inside code blocks
// stays literal.
//
// Display math ($$..$$, \[..\]) and \(..\) go through auto-render, whose

// dollar signs in the DOM would pair up and turn prices into math. Inline
// $..$ is instead extracted here — with pandoc-style guards — and rendered

// not followed by a digit. So "$x$" renders, while "$5 and $10" or "$2+$3"
// stay literal prices.
const MATH_RE = /\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/g;
// Inline $..$: one line, non-space edges, no digit right after the closing '$'.
const INLINE_DOLLAR_RE = /\$([^\s$](?:[^$\n]*?[^\s$])?)\$(?!\d)/g;
const MATH_TOKEN_RE = /MQ(\d+)QM/g;

const MATH_DELIMITERS = [
  { left: "$$", right: "$$", display: true },
  { left: "\\[", right: "\\]", display: true },
  { left: "\\(", right: "\\)", display: false },
];

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function extractMath(source) {
  const codeStore = [];
  const dollarStore = [];
  const mathStore = []; // items: { src, inline }
  // shield fenced + inline code so neither math extraction nor the placeholder
  // rewrite touches code content, then shield escaped dollars so a literal
  // "\$" can never open a $..$ span (restored before markdown runs, so "\$"
  // still renders as a plain '$' outside math)
  let text = String(source)
    .replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g, (m) => {
      codeStore.push(m);
      return "\x00C" + (codeStore.length - 1) + "\x00";
    })
    .replace(/`[^`\n]*`/g, (m) => {
      codeStore.push(m);
      return "\x00C" + (codeStore.length - 1) + "\x00";
    })
    .replace(/\\\$/g, (m) => {
      dollarStore.push(m);
      return "\x00D" + (dollarStore.length - 1) + "\x00";
    });
  text = text.replace(MATH_RE, (m) => {
    mathStore.push({ src: m, inline: false });
    return "MQ" + (mathStore.length - 1) + "QM"; // plain-word token survives markdown
  });
  text = text.replace(INLINE_DOLLAR_RE, (m, inner) => {
    if (/^\d+(?:[.,]\d+)?$/.test(inner)) return m; // "$19.99$" is currency, not math
    mathStore.push({ src: "$" + inner + "$", inline: true });
    return "MQ" + (mathStore.length - 1) + "QM";
  });
  // un-shield: back to "\$" in both the markdown text and any math span that
  // legitimately contained an escaped dollar (KaTeX renders "\$" as '$')
  const unshieldDollars = (s) =>
    s.replace(/\x00D(\d+)\x00/g, (_, i) => dollarStore[+i]);
  text = unshieldDollars(text);
  text = text.replace(/\x00C(\d+)\x00/g, (_, i) => codeStore[+i]);
  mathStore.forEach((item) => {
    item.src = unshieldDollars(item.src);
  });
  return { text, mathStore };
}

// Inline spans are rendered directly instead of going through auto-render:
// katex.renderToString returns finished HTML, so no bare '$' delimiter ever
// has to exist for auto-render. Falls back to the escaped literal when the
// vendored KaTeX is unavailable.
function renderInlineMath(src) {
  if (typeof window.katex === "undefined" || !window.katex.renderToString)
    return null;
  try {
    return window.katex.renderToString(src, {
      displayMode: false,
      throwOnError: false,
    });
  } catch (err) {
    return null;
  }
}

function restoreMath(html, mathStore) {
  return html.replace(MATH_TOKEN_RE, (_, i) => {
    const item = mathStore[+i];
    if (!item) return "";
    if (item.inline) {
      const rendered = renderInlineMath(item.src.slice(1, -1));
      if (rendered !== null) return rendered;
    }
    return escapeHtml(item.src);
  });
}

function renderMath(container) {
  if (typeof window.renderMathInElement !== "function") return;
  try {
    window.renderMathInElement(container, {
      delimiters: MATH_DELIMITERS,
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      throwOnError: false,
    });
  } catch (err) {
    console.error(err);
  }
}

function applyLinkPolicy(container) {
  container.querySelectorAll("a[href]").forEach((link) => {
    link.target = "_blank";
    link.rel = "noopener noreferrer";
  });
}

function addDecodeErrorRow(detail) {
  const row = document.createElement("div");
  row.className = "tool-row glass failed toggleable";
  row.innerHTML =
    '<span class="tool-icon">' +
    ICONS.warn +
    "</span>" +
    '<span class="tool-text">Tool call failed: "' +
    DECODE_ERROR_PREFIX +
    '"</span>' +
    "<pre hidden></pre>";
  row.querySelector("pre").textContent = detail;
  row.addEventListener("click", () => toggleOpen(row));
  placeToolRow(row); // count errored calls toward the run's grouping cap
}

function addFileChip(event) {
  closeFileGroup();
  const chipHost = document.createElement("div");
  chipHost.className =
    "files-group open" + (event.type === "file_sent" ? " right" : "");
  const chip = document.createElement("a");
  chip.className =
    "file-chip glass" + (event.type === "file_sent" ? " outgoing" : "");
  chip.href = event.url ? API_BASE + event.url : "#";
  if (event.url) chip.setAttribute("download", event.name);
  chip.innerHTML = ICONS.file + "<span></span><span class='file-meta'></span>";
  chip.children[1].textContent = event.name;
  chip.children[2].textContent = event.size ? formatSize(event.size) : "";
  chipHost.appendChild(chip);
  append(chipHost);
}

function addEventRow(text, isError) {
  const row = document.createElement("div");
  row.className = "event-row glass" + (isError ? " error" : "");
  row.textContent = text;
  append(row);
}

function addCompactionRow(event) {
  const divider = document.createElement("div");
  divider.className = "compaction-divider";
  divider.textContent = "----- Compaction -----";
  append(divider);
  const box = document.createElement("pre");
  box.className = "compaction-summary glass";
  box.textContent = event.summary;
  append(box);
}

let statusHideTimer = null;

function setStatus(kind, label) {
  statusDot.className = "status-dot " + kind;
  statusLabel.textContent = label;
  const show = kind === "working";
  if (show) {
    if (statusHideTimer) {
      clearTimeout(statusHideTimer);
      statusHideTimer = null;
    }
    statusRow.classList.remove("leaving");
    cancelAnim(statusRow);
    statusRow.style.overflow = "";
    if (statusRow.parentNode !== chat) {
      const stick = isAtBottom();
      chat.appendChild(statusRow);
      growIn(statusRow);
      if (stick) followBottom(700);
    }
  } else if (statusRow.parentNode === chat) {
    statusRow.classList.add("leaving");
    if (!REDUCE && !statusRow._anim) {
      const cs = getComputedStyle(statusRow);
      statusRow.style.overflow = "hidden";
      statusRow._anim = statusRow.animate(
        [
          { ...boxOf(statusRow, cs), marginTop: "0px" },
          { ...BOX_ZERO, marginTop: "-10px" },
        ],
        { duration: 480, easing: EASE_IN, fill: "forwards" },
      );
    }
    if (statusHideTimer) clearTimeout(statusHideTimer);
    statusHideTimer = setTimeout(() => {
      statusHideTimer = null;
      statusRow.classList.remove("leaving");
      cancelAnim(statusRow);
      statusRow.style.overflow = "";
      statusRow.remove();
    }, 480);
  }
}

// ---------- event dispatch ----------
function render(event) {
  const kick = {
    user_message: 1,
    model_message: 0.8,
    busy: 0.6,
    ready: 0.7,
    error: 1,
    tool_call: event.status === "started" ? 0.35 : 0.5,
  }[event.type];
  if (kick && window.ambientKick) window.ambientKick(kick);
  const snd = {
    model_message: "receive",
    error: "error",
    tool_call:
      event.status === "started" ? "tick" : event.failed ? "error" : "done",
  }[event.type];
  if (snd) Sfx.play(snd);
  if (event.type !== "file" && event.type !== "file_sent") closeFileGroup();
  // A decode error is a malformed reply of the ongoing turn, not a new one:
  // keep the run alive so its errored row groups with the surrounding calls.
  const isDecodeError =
    event.type === "error" && event.text.startsWith(DECODE_ERROR_PREFIX);
  if (
    event.type !== "tool_call" &&
    event.type !== "status" &&
    event.type !== "busy" &&
    event.type !== "ready" &&
    !isDecodeError
  ) {
    resetToolRun();
  }
  switch (event.type) {
    case "user_message":
      addBubble(event.content, "user", event.queued);
      break;
    case "model_message":
      addBubble(event.content, "model", false);
      if (!replaying && window.Voice) Voice.speak(event.content);
      break;
    case "history_done":
      replaying = false;
      break;
    case "tool_call":
      if (event.status === "started") addToolRow(event);
      else finishToolRow(event);
      break;
    case "file":
    case "file_sent":
      addFileChip(event);
      break;
    case "compaction":
      addCompactionRow(event);
      break;
    case "status":
      setStatus(busy ? "working" : "ready", event.text);
      break;
    case "busy":
      busy = true;
      setStatus("working", "Working...");
      setSendState();
      updateToolRunThinking();
      updateAmbient();
      break;
    case "ready":
      busy = false;
      setStatus("ready", "Ready");
      setSendState();
      updateToolRunThinking();
      updateAmbient();
      break;
    case "error":
      if (event.text.startsWith(DECODE_ERROR_PREFIX)) {
        addDecodeErrorRow(event.text);
      } else {
        addEventRow(event.text, true);
      }
      setStatus("error", "Error");
      updateAmbient();
      break;
  }
}

// ---------- transport ----------
function connect() {
  ws = new WebSocket(WS_BASE + "/ws/" + clientId);

  ws.onopen = () => {
    reconnectDelay = 1000;
    banner.classList.remove("visible");
    chat.innerHTML = "";
    toolRun = null;
    replaying = true;
    setStatus("ready", "Ready");
    updateAmbient();
  };

  ws.onmessage = (message) => {
    try {
      render(JSON.parse(message.data));
    } catch (err) {
      console.error(err);
    }
  };

  ws.onclose = () => {
    busy = false;
    setSendState();
    setStatus("", "Connecting...");
    updateAmbient();
    banner.classList.add("visible");
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  };

  ws.onerror = () => ws.close();
}

// ---------- composer ----------
function setSendState() {
  // Icon swap (and the .pop animation) only on a send<->stop mode change,
  // which happens when a message is sent or a turn finishes. Typing must
  // not retrigger the animation: rewriting innerHTML on every keystroke
  // would insert a fresh icon that replays the pop while .pop lingers.
  const mode = busy ? "stop" : "send";
  if (sendBtn.dataset.mode !== mode) {
    sendBtn.dataset.mode = mode;
    sendBtn.classList.remove("pop");
    void sendBtn.offsetWidth;
    sendBtn.classList.add("pop");
    sendBtn.innerHTML = busy ? ICONS.stop : ICONS.send;
    sendBtn.title = busy ? "Stop" : "Send";
  }
  document.querySelector(".composer").classList.toggle("busy", busy);
  sendBtn.disabled = busy ? false : !input.value.trim();
}

function sendMessage() {
  const content = input.value.trim();
  if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "message", content: content }));
  Sfx.play("send");
  input.value = "";
  fitInput();
  setSendState();
  input.focus();
}

function sendStop() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "stop" }));
  setStatus("working", "Stopping...");
}

// ---------- new chat ----------
// Stops the running turn (the server does the same if it is still busy),
// wipes the VM + conversation server-side, then reconnects for a fresh
// session with a brand new container. Teardown is not instant — stopping a
// turn alone can wait up to 20s server-side, plus container cleanup — so
// the button disables itself and the client says what is going on instead
// of sitting silent on a clickable button.
let newChatBusy = false;

async function newChat() {
  if (newChatBusy) return;
  newChatBusy = true;
  newchatBtn.disabled = true;
  Sfx.play("click");
  setStatus("working", "Cleaning up, please wait...");
  addEventRow("Cleaning up the VM, please wait...");
  try {
    if (busy && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "stop" })); // stop-then-wipe
    }
    const response = await fetch(API_BASE + "/api/new-chat/" + clientId, {
      method: "POST",
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    if (ws) {
      ws.onclose = null;
      ws.close();
      ws = null;
    }
    chat.innerHTML = "";
    toolRun = null;
    busy = false;
    setSendState();
    addEventRow("Starting a fresh session...");
    input.focus();
    connect(); // onopen clears the rest of the visual state
  } catch (err) {
    addEventRow("Could not start a new chat: " + err.message, true);
    setStatus("ready", "Ready");
  } finally {
    newChatBusy = false;
    newchatBtn.disabled = false;
  }
}

function uploadFiles(files) {
  for (const file of files) {
    const form = new FormData();
    form.append("file", file);
    fetch(API_BASE + "/api/upload/" + clientId, { method: "POST", body: form })
      .then((response) => {
        if (!response.ok)
          throw new Error("Upload failed (" + response.status + ")");
      })
      .catch((err) =>
        addEventRow("Could not send " + file.name + ": " + err.message, true),
      );
  }
}

// ---------- wiring & boot ----------
attachBtn.innerHTML = ICONS.clip;
newchatBtn.innerHTML = ICONS.newchat;
setSendState();
input.focus();

sendBtn.addEventListener("click", () =>
  busy ? (Sfx.play("stop"), sendStop()) : sendMessage(),
);
attachBtn.addEventListener("click", () => fileInput.click());
newchatBtn.addEventListener("click", newChat);
fileInput.addEventListener("change", () => {
  uploadFiles(fileInput.files);
  fileInput.value = "";
});

input.addEventListener("input", () => {
  fitInput();
  setSendState();
});
input.addEventListener("keydown", (keyEvent) => {
  if (keyEvent.key === "Enter" && !keyEvent.shiftKey) {
    keyEvent.preventDefault();
    sendMessage();
  }
});

connect();

/* ==== js/voice.js ==== */
"use strict";

// Voice mode: records the microphone, stops after a stretch of silence,
// transcribes the clip server-side and sends it as a regular message; new
// model replies are fetched from the speech endpoint and played out loud.
// It starts muted and only turns on through an explicit user toggle; the
// choice is remembered across visits. Tuning and model availability arrive
// via SYNA_CONFIG.voice. The module is published as window.Voice so chat.js
// (a separate script block) can route model messages to speak() — a
// top-level const alone would not be visible across scripts as a window
// property.

const Voice = (() => {
  const settings = (window.SYNA_CONFIG && window.SYNA_CONFIG.voice) || {};
  const SILENCE_TIMEOUT_MS = settings.silence_timeout_ms || 2000;
  const SILENCE_THRESHOLD_DBFS = Number.isFinite(
    settings.silence_threshold_dbfs,
  )
    ? settings.silence_threshold_dbfs
    : -45;
  const MAX_RECORDING_MS = settings.max_recording_ms || 60000;
  const STT_AVAILABLE = !!settings.stt_available;
  const TTS_AVAILABLE = !!settings.tts_available;
  const STORAGE_KEY = "syna-voice";

  const micBtn = document.getElementById("mic-btn");
  const voiceBtn = document.getElementById("voice-btn");

  let enabled = readStoredEnabled();
  let recorder = null;
  let recorderStream = null;
  let meterContext = null;
  let analyser = null;
  let meterHandle = null;
  let recordingStartedAt = 0;
  let silenceStartedAt = 0;
  let recordingAborted = false;
  let playback = null;
  let playbackUrl = null;

  function readStoredEnabled() {
    try {
      return localStorage.getItem(STORAGE_KEY) === "on";
    } catch (err) {
      return false;
    }
  }

  function persistEnabled() {
    try {
      localStorage.setItem(STORAGE_KEY, enabled ? "on" : "off");
    } catch (err) {}
  }

  function paint() {
    voiceBtn.classList.toggle("muted", !enabled);
    voiceBtn.disabled = !(STT_AVAILABLE || TTS_AVAILABLE);
    voiceBtn.title = enabled ? "Disable voice mode" : "Enable voice mode";
    document.body.classList.toggle("voice-off", !enabled || !STT_AVAILABLE);
  }

  function speakableText(markdown) {
    return markdown
      .replace(/```[\s\S]*?```/g, " ")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/^\s{0,3}#{1,6}\s+/gm, "")
      .replace(/^\s*[-*+]\s+/gm, "")
      .replace(/^\s*\|.*\|\s*$/gm, "")
      .replace(/(\*\*|__|\*|_|~~)/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function stopPlayback() {
    if (playback) {
      playback.pause();
      playback = null;
    }
    if (playbackUrl) {
      URL.revokeObjectURL(playbackUrl);
      playbackUrl = null;
    }
    voiceBtn.classList.remove("speaking");
  }

  async function speak(rawText) {
    const text = speakableText(String(rawText || ""));
    if (!enabled || !TTS_AVAILABLE || !text) return;
    stopPlayback();
    try {
      const response = await fetch(API_BASE + "/api/speech/synthesize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      });
      const payload = response.ok
        ? null
        : await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error(
          (payload && payload.detail) || "HTTP " + response.status,
        );
      }
      playbackUrl = URL.createObjectURL(await response.blob());
      playback = new Audio(playbackUrl);
      playback.onended = () => voiceBtn.classList.remove("speaking");
      voiceBtn.classList.add("speaking");
      await playback.play();
    } catch (err) {
      voiceBtn.classList.remove("speaking");
      console.error(err);
      addEventRow("Speech playback failed: " + err.message, true);
    }
  }

  function pickRecorderMime() {
    if (!window.MediaRecorder) return "";
    const candidates = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/ogg",
      "audio/mp4",
    ];
    return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
  }

  function extensionFor(mime) {
    if (String(mime).includes("ogg")) return "ogg";
    if (String(mime).includes("mp4")) return "m4a";
    return "webm";
  }

  function resetRecorderState() {
    clearInterval(meterHandle);
    meterHandle = null;
    analyser = null;
    if (meterContext) {
      meterContext.close().catch(() => {});
      meterContext = null;
    }
    if (recorderStream) {
      recorderStream.getTracks().forEach((track) => track.stop());
      recorderStream = null;
    }
    recorder = null;
    micBtn.classList.remove("recording");
  }

  function rmsDbfs(samples) {
    let sum = 0;
    for (const sample of samples) sum += sample * sample;
    return 20 * Math.log10(Math.sqrt(sum / samples.length) || 1e-10);
  }

  function meterLoop() {
    const buffer = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buffer);
    const now = performance.now();
    if (now - recordingStartedAt >= MAX_RECORDING_MS) return stopRecording();
    if (rmsDbfs(buffer) < SILENCE_THRESHOLD_DBFS) {
      if (!silenceStartedAt) silenceStartedAt = now;
      else if (now - silenceStartedAt >= SILENCE_TIMEOUT_MS) stopRecording();
    } else {
      silenceStartedAt = 0;
    }
  }

  async function startRecording() {
    stopPlayback();
    try {
      recorderStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
      });
    } catch (err) {
      console.error(err);
      addEventRow(
        err.name === "NotAllowedError"
          ? "Microphone access was denied."
          : "Could not open the microphone: " + err.message,
        true,
      );
      return;
    }
    const mimeType = pickRecorderMime();
    const chunks = [];
    recorder = new MediaRecorder(
      recorderStream,
      mimeType ? { mimeType: mimeType } : undefined,
    );
    recorder.ondataavailable = (event) => {
      if (event.data.size) chunks.push(event.data);
    };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, {
        type: recorder.mimeType || mimeType || "audio/webm",
      });
      const aborted = recordingAborted;
      resetRecorderState();
      if (!aborted) await transcribeAndSend(blob);
    };
    meterContext = new AudioContext();
    const source = meterContext.createMediaStreamSource(recorderStream);
    analyser = meterContext.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser);
    meterContext.resume().catch(() => {});
    recorder.start();
    recordingStartedAt = performance.now();
    silenceStartedAt = 0;
    recordingAborted = false;
    micBtn.classList.add("recording");
    meterHandle = setInterval(meterLoop, 100);
  }

  function stopRecording() {
    if (recorder && recorder.state !== "inactive") recorder.stop();
  }

  function cancelRecording() {
    if (!recorder) return;
    recordingAborted = true;
    stopRecording();
  }

  async function transcribeAndSend(blob) {
    micBtn.disabled = true;
    micBtn.title = "Transcribing...";
    try {
      const form = new FormData();
      form.append("file", blob, "voice-note." + extensionFor(blob.type));
      const response = await fetch(API_BASE + "/api/speech/transcribe", {
        method: "POST",
        body: form,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok)
        throw new Error(payload.detail || "HTTP " + response.status);
      const text = (payload.text || "").trim();
      if (!text) {
        addEventRow("Nothing was heard in the recording.", true);
        return;
      }
      input.value = text;
      sendMessage();
    } catch (err) {
      console.error(err);
      addEventRow("Transcription failed: " + err.message, true);
    } finally {
      micBtn.disabled = false;
      micBtn.title = "Talk";
    }
  }

  micBtn.innerHTML = ICONS.mic;
  voiceBtn.innerHTML = ICONS.speakerOn + ICONS.speakerOff;
  paint();

  voiceBtn.addEventListener("click", () => {
    enabled = !enabled;
    persistEnabled();
    if (!enabled) {
      stopPlayback();
      cancelRecording();
    }
    paint();
  });

  micBtn.addEventListener("click", () =>
    recorder ? stopRecording() : startRecording(),
  );

  addEventListener("beforeunload", () => {
    cancelRecording();
    stopPlayback();
  });

  return {
    speak,
    stopPlayback,
    get enabled() {
      return enabled;
    },
  };
})();

window.Voice = Voice;
