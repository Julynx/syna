[project]
name = "syna-agent"
version = "0.11.14"
description = "Terminal and web AI agent that answers requests by driving an LLM in a tool-call loop inside a sandboxed container pod."
readme = "docs/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Julynx", email = "julicabria@outlook.com" }
]
requires-python = ">=3.12"
keywords = ["ai", "agent", "llm", "tools", "sandbox", "openrouter", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openrouter>=1.1.137",
    "python-dotenv>=1.2.3",
    "httpx>=0.27",
    "bollard>=0.2.3",
    "playwright==1.62.0",
    "pillow>=11.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "camoufox[geoip]>=0.5.8",
]

[project.scripts]
syna = "syna.server:main"
syna-agent = "syna.server:main"
syna-server = "syna.server:main"
syna-cli = "syna:main"
syna-setup = "syna.setup:main"

[project.urls]
Homepage = "https://julynx.github.io/syna/"
Repository = "https://github.com/Julynx/syna"
Issues = "https://github.com/Julynx/syna/issues"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "syna"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
