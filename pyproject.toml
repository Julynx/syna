[project]
name = "syna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julynx", email = "julicabria@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openrouter>=1.1.137",
    "python-dotenv>=1.2.3",
    "string-grab>=1.3.0",
    "bollard>=0.1.3",
    "playwright==1.60.0",
    "ddgs>=9.16.0",
    "drissionpage>=4.1.1.4",
    "markdownify>=1.2.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
syna = "syna:main"
syna-server = "syna.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
