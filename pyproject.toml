[project]
name = "syna"
version = "0.1.0"
description = "Terminal and web AI agent that answers requests by driving an LLM in a tool-call loop inside a sandboxed Docker pod."
readme = "README.md"
authors = [
    { name = "Julynx", email = "julicabria@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openrouter>=1.1.137",
    "python-dotenv>=1.2.3",
    "httpx>=0.27",
    "bollard>=0.1.3",
    "playwright==1.62.0",
    "ddgs>=9.16.0",
    "drissionpage>=4.1.1.4",
    "markdownify>=1.2.3",
    "pillow>=11.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "camoufox[geoip]>=0.5.8",
]

[project.scripts]
syna = "syna:main"
syna-server = "syna.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
